name: Merge

on:
  workflow_call:
    inputs:
      method:
        description: The gh pr merge method, merge, squash or rebase.
        type: string
        default: merge
      client-id:
        description: The client ID of the GitHub App that merges.
        type: string
        required: true
      environment:
        description: Optional GitHub Actions environment that holds MERGE_APP_KEY.
        type: string
        default: ''
    secrets:
      MERGE_APP_KEY:
        required: false

jobs:
  merge:
    if: github.event_name == 'pull_request_target' && github.event.label.name == 'merge'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.base_ref }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      METHOD: ${{ inputs.method || 'merge' }}
    steps:
      - name: Targets the default branch
        run: |
          if [ "$BASE" != "$DEFAULT_BRANCH" ]; then
            echo "Merge into $DEFAULT_BRANCH only: this pull request targets $BASE" >&2
            exit 1
          fi
      - name: Rebased onto the base branch
        run: >
          gh api "repos/$GH_REPO/compare/$BASE...$HEAD" --jq '
            if .behind_by > 0 then error("Rebase onto \(env.BASE): \(.behind_by) commits behind")
            elif any(.commits[]; .parents | length > 1) then error("Rebase onto \(env.BASE) without merge commits")
            else empty end'
      - name: Checks passed
        run: >
          gh pr view "$PR" --json statusCheckRollup --jq '
            [.statusCheckRollup[]
              | select(.workflowName != env.GITHUB_WORKFLOW)
              | select(.conclusion // .state | IN("SUCCESS", "NEUTRAL", "SKIPPED") | not)
              | .name // .context]
            | if length > 0 then error("Checks not passed: \(join(", "))") else empty end'
      # Merges made with GITHUB_TOKEN start no push workflows and close no
      # linked issues, even when it can write issues.
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.MERGE_APP_KEY }}
      - if: github.event.pull_request.draft
        run: gh pr ready "$PR"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
      - run: gh pr merge "$PR" --"$METHOD" --match-head-commit "$HEAD"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
      - if: failure()
        run: gh pr edit "$PR" --remove-label merge
