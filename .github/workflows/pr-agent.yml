name: PR-Agent

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

jobs:
  pr_agent:
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && (github.event.sender.type != 'Bot' || github.event.sender.login == 'joacoesteban-agent-sandbox[bot]'))
      || (github.event_name == 'issue_comment'
        && github.event.sender.type != 'Bot'
        && github.event.issue.pull_request
        && startsWith(github.event.comment.body, '/')
        && github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Installed from a commit because 0.1.0 is not on PyPI yet. PR-Agent is pinned because the handlers patch its internals.
      - run: pip install "git+https://github.com/akalongman/pr-agent-cli-handlers@0b10c1b658bd4aba8fb93a6d439499c48f06dfcb" "pr-agent[github,gitlab]==0.49.0"
      - run: npm install -g @anthropic-ai/claude-code@2.1.302
      - run: pr-agent-cli-handlers action
        env:
          PR_AGENT_CLI_HANDLER: claude_code
          PR_AGENT_CLI_TIMEOUT: "600"
          CONFIG__MODEL: claude-opus-5-5
          CONFIG__REASONING_EFFORT: low
          CONFIG__MAX_MODEL_TOKENS: "200000"
          CONFIG__FALLBACK_MODELS: '["claude-opus-5"]'
          GITHUB_ACTION_CONFIG__HANDLE_PUSH_TRIGGER: "true"
          GITHUB_ACTION_CONFIG__PUSH_TRIGGER_IGNORE_BOT_COMMITS: "false"
          GITHUB_ACTION_CONFIG__PUSH_COMMANDS: '["/describe", "/review", "/improve"]'
          PR_REVIEWER__INLINE_KEY_ISSUES: "true"
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
